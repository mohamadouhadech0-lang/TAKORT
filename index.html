<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAKORT - تاكورت لكرة القدم</title>
    
    <!-- كود الإعلان الجديد (popunder / social bar) -->
    <script data-cfasync="false" src="https://czernik.org/14/a1465396de94e8476cb2e1126002fb1d"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* تنسيق الزر */
        .show-btn {
            background-color: #38bdf8;
            color: #0f172a;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 15px 0;
        }

        .show-btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        /* حاوية الإعلانات */
        .ad-container {
            margin: 25px 0;
            padding: 15px;
            background-color: #0f172a;
            border: 1px dashed #38bdf8;
            border-radius: 8px;
        }

        /* الإعلان الأول سيكون مخفياً تحت الزر */
        #adBox1 {
            display: none;
        }

        .ad-title {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 10px;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>TAKORT</h1>
        <p>موقعك الرياضي لمتابعة أحدث أخبار ونتائج كرة القدم</p>
    </header>

    <div class="container">
        <h2>أهلاً بك في منصة تاكورت</h2>
        <p style="margin-top: 10px; color: #cbd5e1;">اضغط على الزر أدناه لعرض المحتوى والنتائج المباشرة.</p>
