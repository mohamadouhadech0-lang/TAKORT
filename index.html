<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول المباريات الحية</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--head:#e6eaf1;--tx:#10151f;--mut:#6b7587;--acc:#0ea58c;--pill:#edf0f5}
@media (prefers-color-scheme:dark){:root{--bg:#0d1220;--card:#151b2d;--head:#1c2438;--tx:#f2f5fa;--mut:#8b95ab;--acc:#2ad4b5;--pill:#0f1525}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:30px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:22px;color:var(--acc)}
.nav{display:flex;gap:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--mut)}
.date{padding:4px 16px 10px;font-size:18px;font-weight:700}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.chip{padding:7px 14px;border-radius:99px;background:var(--card);color:var(--mut);font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--acc);color:#06201b;font-weight:700}
.league{background:var(--head);margin:12px 12px 6px;padding:10px 14px;border-radius:14px;font-weight:700}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);margin:0 12px 8px;padding:16px 12px;border-radius:14px}
.t{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.3}
.t.away{flex-direction:row-reverse}
.crest{flex:none;width:32px;height:32px;border-radius:50%;object-fit:contain;background:var(--pill)}
.mid{min-width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time,.score{background:var(--pill);padding:8px 14px;border-radius:12px;font-weight:700;font-size:17px;direction:ltr;white-space:nowrap}
.score i{color:var(--mut);font-style:normal;margin:0 6px}
.score.live{color:var(--acc)}
.min{display:block;text-align:center;font-size:12px;color:var(--acc);margin-top:2px}
.empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:15px}
.ad-container{text-align:center;margin:10px auto;display:flex;justify-content:center}
</style>
</head>
<body>

<header>
  <div class="logo">المباريات الحية</div>
  <div class="nav">
    <button class="ib" onclick="fetchLiveMatches()">🔄</button>
  </div>
</header>

<div class="date" id="currentDate">--</div>

<div class="chips">
  <button class="chip" aria-pressed="true" onclick="filterMatches('all', this)">الكل</button>
  <button class="chip" aria-pressed="false" onclick="filterMatches('live', this)">مباشر</button>
  <button class="chip" aria-pressed="false" onclick="filterMatches('finished', this)">انتهت</button>
  <button class="chip" aria-pressed="false" onclick="filterMatches('notstarted', this)">لم تبدأ</button>
</div>

<!-- الإعلان -->
<div class="ad-container">
  <script>
    atOptions = {
      'key' : 'ea661d3865d68b7895e1f66b35f35dda',
      'format' : 'iframe',
      'height' : 300,
      'width' : 160,
      'params' : {}
    };
  </script>
  <script src="https://czernik.org/22/ea661d3865d68b7895e1f66b35f35dda"></script>
</div>

<main id="app">
  <div class="empty">جاري اتصال وتحديث مباريات اليوم...</div>
</main>

<script>
  let allMatchesData = [];
  let currentFilter = 'all';

  const todayObj = new Date();
  document.getElementById('currentDate').innerText = todayObj.toLocaleDateString('ar-MA', {
    weekday: 'long',
    day: 'numeric',
    month: 'long'
  });

  async function fetchLiveMatches() {
    const appContainer = document.getElementById('app');
    appContainer.innerHTML = '<div class="empty">جاري جلب المباريات الحية...</div>';

    try {
      // جلب البيانات من مصدر حي مفتوح دون التعرض لمشاكل CORS
      const dateStr = todayObj.toISOString().split('T')[0];
      const res = await fetch(`https://api.openligadb.de/getmatchdata/bl1/${todayObj.getFullYear()}`);
      
      if (!res.ok) throw new Error('تعذر الاتصال بالسيرفر');

      const rawData = await res.json();
      
      allMatchesData = rawData.slice(0, 15).map(m => {
        const isFinished = m.matchIsFinished;
        const lastResult = m.matchResults && m.matchResults.length > 0 ? m.matchResults[m.matchResults.length - 1] : null;
        
        return {
          league: m.group ? m.group.groupName : 'مباريات مباشرة',
          home: m.team1.teamName,
          homeIcon: m.team1.teamIconUrl || '',
          away: m.team2.teamName,
          awayIcon: m.team2.teamIconUrl || '',
          homeScore: lastResult ? lastResult.pointsTeam1 : '-',
          awayScore: lastResult ? lastResult.pointsTeam2 : '-',
          status: isFinished ? 'انتهت' : 'لم تبدأ',
          isLive: !isFinished && lastResult !== null
        };
      });

      renderMatches();
    } catch (err) {
      console.error(err);
      appContainer.innerHTML = `<div class="empty">تعذّر جلب المباريات.<br><small>يرجى إعادة المحاولة لاحقاً.</small></div>`;
    }
  }

  function renderMatches() {
    const appContainer = document.getElementById('app');
    
    if (!allMatchesData || allMatchesData.length === 0) {
      appContainer.innerHTML = '<div class="empty">لا توجد مباريات جارية حالياً.</div>';
      return;
    }

    const filtered = allMatchesData.filter(m => {
      if (currentFilter === 'live') return m.isLive;
      if (currentFilter === 'finished') return m.status === 'انتهت';
      if (currentFilter === 'notstarted') return m.status === 'لم تبدأ' && !m.isLive;
      return true;
    });

    if (filtered.length === 0) {
      appContainer.innerHTML = '<div class="empty">لا توجد مباريات مطابقة للفلتر.</div>';
      return;
    }

    const leaguesMap = {};
    filtered.forEach(m => {
      if (!leaguesMap[m.league]) leaguesMap[m.league] = [];
      leaguesMap[m.league].push(m);
    });

    let html = '';
    for (const [leagueName, matches] of Object.entries(leaguesMap)) {
      html += `<div class="league">${leagueName}</div>`;
      
      matches.forEach(m => {
        html += `
          <div class="m">
            <div class="t">
              ${m.homeIcon ? `<img class="crest" src="${m.homeIcon}" alt="${m.home}" onerror="this.style.display='none'">` : ''}
              <span>${m.home}</span>
            </div>
            
            <div class="mid">
              ${m.homeScore !== '-' ? `
                <div class="score ${m.isLive ? 'live' : ''}">
                  ${m.homeScore} <i>-</i>${m.awayScore}
                </div>
                <span class="min">${m.isLive ? 'مباشر' : m.status}</span>
              ` : `
                <div class="time">${m.status}</div>
              `}
            </div>

            <div class="t away">
              ${m.awayIcon ? `<img class="crest" src="${m.awayIcon}" alt="${m.away}" onerror="this.style.display='none'">` : ''}
              <span>${m.away}</span>
            </div>
          </div>
        `;
      });
    }

    appContainer.innerHTML = html;
  }

  function filterMatches(type, btnElement) {
    currentFilter = type;
    document.querySelectorAll('.chip').forEach(btn => btn.setAttribute('aria-pressed', 'false'));
    btnElement.setAttribute('aria-pressed', 'true');
    renderMatches();
  }

  fetchLiveMatches();
  setInterval(fetchLiveMatches, 60000);
</script>

</body>
</html>
