<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول المباريات والبث المباشر</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; text-align: center; }
    #player-wrapper { margin: 15px auto; max-width: 800px; width: 100%; position: relative; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .card { background: #1e293b; border-radius: 10px; padding: 15px; margin: 10px auto; max-width: 500px; }
    .cta { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .cta:hover { background: #dc2626; }
    #toast { visibility: hidden; background-color: #333; color: #fff; text-align: center; border-radius: 5px; padding: 10px; position: fixed; z-index: 100; bottom: 30px; left: 50%; transform: translateX(-50%); }
    #toast.show { visibility: visible; }
  </style>
</head>
<body>

  <h2>جدول المباريات والبث المباشر</h2>
  <div id="player-wrapper"></div>
  <div id="list"></div>
  <div id="toast"></div>

  <script>
    // ضع رابط الـ iframe الخاص بك هنا (تأكد من أن الرابط يعمل ولا ينتهي بصلاحية سريعة)
    const FIRST_MATCH_STREAM = "https://912acsss8af382.yasirtv.com/playerv5.php?match=4750824&key=9f39972b67d6ce22189507d008acwc26";

    function openStream(streamUrl) {
      const playerContainer = document.getElementById("player-wrapper");
      playerContainer.innerHTML = `
        <div style="position: relative; padding-top: 56.25%;">
          <button onclick="closeStream()" style="position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.8); color: #fff; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold;">✕ إغلاق البث</button>
          <iframe src="${streamUrl}" style="position: absolute; top:0; left:0; width:100%; height:100%; border:0;" allowfullscreen scrolling="no"></iframe>
        </div>
      `;
      playerContainer.scrollIntoView({ behavior: 'smooth' });
    }

    function closeStream() {
      document.getElementById("player-wrapper").innerHTML = "";
    }

    function render() {
      const listContainer = document.getElementById("list");
      listContainer.innerHTML = `
        <article class="card">
          <h3>الأهلي ضد الزمالك</h3>
          <p>الحالة: مباشر 🔴</p>
          <button class="cta" onclick="openStream(FIRST_MATCH_STREAM)">شاهد المباراة الآن</button>
        </article>
      `;
    }

    function toast(t) {
      const e = document.getElementById("toast");
      e.textContent = t;
      e.className = "show";
      setTimeout(() => e.className = e.className.replace("show", ""), 2200);
    }

    render();
  </script>
</body>
</html>
