<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول المباريات والبث المباشر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--card:#fff;--text:#14171f;--muted:#6b7280;--line:#e5e7eb;--red:#e11d2e;--red-d:#b91423;--green:#16a34a;--banner:#14171f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--card:#181b23;--text:#f1f2f5;--muted:#9aa1af;--line:#272b36;--banner:#232733}}
:root[data-theme="dark"]{--bg:#0e1015;--card:#181b23;--text:#f1f2f5;--muted:#9aa1af;--line:#272b36;--banner:#232733}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh}
.promo{display:flex;align-items:center;gap:10px;background:var(--banner);color:#fff;padding:10px 14px}
.promo .ic{width:34px;height:34px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-weight:800}
.promo p{margin:0;flex:1;font-size:13px;line-height:1.4}
.promo a{background:#fff;color:#14171f;font-weight:700;font-size:12px;padding:7px 12px;border-radius:8px;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px}
header h1{font-size:19px;margin:0;font-weight:800}
.tz{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 13px Cairo,sans-serif}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px 12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 0;font:700 14px Cairo,sans-serif;cursor:pointer}
.tab small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.tab.on small{color:#ffd9dc}
.tab:focus-visible,.cta:focus-visible,.tz:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.list{padding:0 14px 30px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card.live{border-color:var(--red)}
.main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:16px 10px 12px}
