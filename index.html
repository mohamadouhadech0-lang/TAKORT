<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص الاتصال</title>
<style>
body{font-family:Tahoma,sans-serif;background:#0d1220;color:#f2f5fa;padding:20px;direction:rtl}
pre{background:#151b2d;padding:15px;border-radius:10px;overflow-x:auto;direction:ltr;text-align:left;color:#2ad4b5}
</style>
</head>
<body>
<h2>نتائج فحص الاتصال بـ API:</h2>
<pre id="result">جاري الفحص...</pre>

<script>
  const API_TOKEN = 'MyUlh-yVa4Kh4r50';
  const API_USER = 'تاكورت';
  
  async function testApi() {
    const targetUrl = `https://api.soccersapi.com/v2.2/livescores/?user=${encodeURIComponent(API_USER)}&token=${API_TOKEN}&t=list`;
    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

    try {
      const res = await fetch(proxyUrl);
      const text = await res.text();
      document.getElementById('result').innerText = "حالة الرد: " + res.status + "\n\nالبيانات المستلمة:\n" + text;
    } catch (err) {
      document.getElementById('result').innerText = "حدث خطأ في الاتصال:\n" + err.message;
    }
  }

  testApi();
</script>
</body>
</html>
