<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص الاتصال</title>
<style>
  body{background:#0d1220;color:#fff;font-family:sans-serif;padding:20px;direction:ltr;text-align:left}
  pre{background:#151b2d;padding:15px;border-radius:10px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
  <h2>SoccersAPI Response Debugger:</h2>
  <div id="output">جاري فحص الرد...</div>

<script>
  async function check() {
    try {
      const res = await fetch('/api/matches');
      const data = await res.json();
      document.getElementById('output').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
    } catch(err) {
      document.getElementById('output').innerText = 'Error: ' + err.message;
    }
  }
  check();
</script>
</body>
</html>
