<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAKORT - تاكورت لكرة القدم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        header {
            width: 100%;
            background-color: #1e293b;
            padding: 1.2rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid #22c55e;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: #22c55e;
            font-size: 2rem;
            letter-spacing: 1.5px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        main {
            width: 100%;
            max-width: 650px;
            padding: 1.5rem 1rem;
        }

        .section-title {
            margin-bottom: 1rem;
            color: #38bdf8;
            font-size: 1.2rem;
            border-right: 4px solid #38bdf8;
            padding-right: 8px;
        }

        .match-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
        }

        .match-card:hover {
            transform: translateY(-2px);
            border-color: #22c55e;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1rem;
            flex: 1;
        }

        .team.home {
            justify-content: flex-end;
            text-align: left;
        }

        .team.away {
            justify-content: flex-start;
            text-align: right;
        }

        .match-center {
            text-align: center;
            padding: 0 15px;
        }

        .score {
            background: #0f172a;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
            border: 1px solid #334155;
            min-width: 70px;
            display: inline-block;
        }

        .status {
            font-size: 0.8rem;
            margin-top: 6px;
            font-weight: 600;
        }

        .status.live {
            color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        .status.upcoming {
            color: #94a3b8;
        }

        .status.finished {
            color: #22c55e;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        footer {
            margin-top: auto;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚽ TAKORT</h1>
        <p>تطبيق نتـائج المـباريات والإحصائيـات المباشرة</p>
    </header>

    <main>
        <h2 class="section-title">مباريات اليوم المباشرة</h2>
        
        <!-- مباراة مباشرة -->
        <div class="match-card">
            <div class="team home">الوداد الرياضي</div>
            <div class="match-center">
                <div class="score">2 - 1</div>
                <div class="status live">🔴 مباشر 75'</div>
            </div>
            <div class="team away">الرجاء الرياضي</div>
        </div>

        <!-- مباراة قادمة -->
        <div class="match-card">
            <div class="team home">ريال مدريد</div>
            <div class="match-center">
                <div class="score">21:00</div>
                <div class="status upcoming">لم تبدأ بعد</div>
            </div>
            <div class="team away">برشلونة</div>
        </div>

        <!-- مباراة منتهية -->
        <div class="match-card">
            <div class="team home">مانشستر سيتي</div>
            <div class="match-center">
                <div class="score">3 - 0</div>
                <div class="status finished">انتهت</div>
            </div>
            <div class="team away">أرسنال</div>
        </div>
    </main>

    <footer>
        <p>© 2026 TAKORT App - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
